[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "fabric-partition-refresh"
version = "0.1.0"
description = "Refresh specific (historic) partitions of a Microsoft Fabric / Power BI semantic model from a notebook."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anjini Kumar Gaur" }]
keywords = ["microsoft-fabric", "power-bi", "semantic-model", "partitions", "tmsl", "incremental-refresh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
# sempy is preinstalled in Fabric notebooks; this extra is only for use elsewhere.
fabric = ["semantic-link-sempy"]
# ipywidgets is preinstalled in Fabric notebooks; this extra is for use elsewhere.
ui = ["ipywidgets>=8"]
dev = ["ipywidgets>=8", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pandas-stubs", "build"]

[project.urls]
Homepage = "https://github.com/akg-byte/fabric-partition-refresh"
Issues = "https://github.com/akg-byte/fabric-partition-refresh/issues"
Changelog = "https://github.com/akg-byte/fabric-partition-refresh/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/fabric_partition_refresh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sempy", "sempy.*", "ipywidgets", "ipywidgets.*", "IPython", "IPython.*"]
ignore_missing_imports = true
